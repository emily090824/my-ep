<!doctype html>
<!-- Dev tool: draws the site icon (browser tab, home screen): the rolodex from the corner
     button, on an ivory tile. Not linked from the site. -->
<html lang="en"><head><meta charset="utf-8"><title>Icon</title>
<style>html,body{margin:0;background:#777}</style></head>
<body><canvas id="c"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search), S = +(q.get("s") || 512), tiny = S <= 32;
  const c = document.getElementById("c"); c.width = c.height = S; const g = c.getContext("2d");
  const IVORY = "#f4eedf", GREEN = "#1d3124";
  // the tile: ivory, with the cards' double rule at larger sizes
  const r = S * 0.2;
  g.fillStyle = IVORY; g.beginPath(); g.roundRect(0, 0, S, S, r); g.fill();
  if (!tiny) {
    g.strokeStyle = GREEN; g.lineWidth = S * 0.03; const i = S * 0.07;
    g.beginPath(); g.roundRect(i, i, S - 2 * i, S - 2 * i, r * 0.7); g.stroke();
  }
  // the rolodex, drawn in the corner button's own 48-unit space
  const pad = tiny ? S * 0.02 : S * 0.15, k = (S - 2 * pad) / 48;
  g.save(); g.translate(pad, pad + (tiny ? S * 0.01 : 0)); g.scale(k, k);
  g.lineJoin = g.lineCap = "round"; g.strokeStyle = GREEN;
  g.lineWidth = tiny ? (S <= 16 ? 4.2 : 3) : 2.1;
  const card = (deg) => {
    g.save(); g.translate(24, 27); g.rotate(deg * Math.PI / 180); g.translate(-24, -27);
    g.beginPath(); g.roundRect(15, 6, 18, 13, 1.8); g.fillStyle = IVORY; g.fill(); g.stroke(); g.restore();
  };
  (tiny ? [-34, 34, 0] : [-42, 42, -21, 21, 0]).forEach(card);   // fewer cards at tab size, so they stay distinct
  g.beginPath(); g.arc(24, 27, 4.2, 0, Math.PI * 2); g.fillStyle = IVORY; g.fill(); g.stroke();
  g.beginPath(); g.arc(24, 27, 1.3, 0, Math.PI * 2); g.fillStyle = GREEN; g.fill();
  g.beginPath(); g.moveTo(24, 31.5); g.lineTo(17, 40.5); g.moveTo(24, 31.5); g.lineTo(31, 40.5); g.moveTo(12, 41); g.lineTo(36, 41); g.stroke();
  g.restore();
  window.__done = c.toDataURL("image/png");
})();
</script></body></html>
